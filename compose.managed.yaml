services:
  migrate:
    image: ai-project-management-migrate:${IMAGE_TAG:-local}
    build:
      context: .
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${MANAGED_DATABASE_URL:?Set MANAGED_DATABASE_URL to the managed PostgreSQL connection string}

  app:
    image: ai-project-management:${IMAGE_TAG:-local}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    environment: &application-environment
      NODE_ENV: production
      PORT: 4000
      APP_URL: ${APP_URL:?Set APP_URL to the public API URL}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL to the frontend URL}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN to the allowed frontend origin}
      DATABASE_URL: ${MANAGED_DATABASE_URL:?Set MANAGED_DATABASE_URL to the managed PostgreSQL connection string}
      REDIS_URL: ${MANAGED_REDIS_URL:?Set MANAGED_REDIS_URL to the managed Redis connection string}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET:?Set a strong JWT_ACCESS_TOKEN_SECRET}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET:?Set a strong JWT_REFRESH_TOKEN_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set a strong COOKIE_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-15m}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URI: ${GOOGLE_CALLBACK_URI:-${APP_URL}/auth/google/callback}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_PREMIUM: ${STRIPE_PRICE_PREMIUM:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/models}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: ai-project-management:${IMAGE_TAG:-local}
    command: ["node", "dist/src/jobs/worker.js"]
    restart: unless-stopped
    init: true
    environment: *application-environment
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
